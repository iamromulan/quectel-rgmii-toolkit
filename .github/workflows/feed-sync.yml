name: Sync SDXPINN with dev branch

# Promote the dev feed to stable: merge development-SDXPINN into SDXPINN.
# Holds no signing key. It only moves what CI already signed on the dev branch,
# and refuses to continue unless that signature verifies and the merged feed is
# exactly the dev feed.

on:
  workflow_dispatch:
    inputs:
      feed:
        description: 'Stable branch to update from its development-<name> branch'
        type: choice
        options: [SDXPINN]
        default: SDXPINN
      confirm:
        description: 'Tick to really merge and push; unticked only shows what would be promoted'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: feed-sync
  cancel-in-progress: false

env:
  # sha256 of opkg-feed/usign_x64 (same pin as opkg-feed.yml on the feed branch).
  USIGN_SHA256: 961aacc9dc143c3e14bd04732e7917ff2801c2b705131ba9416c38e1022bf169

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the stable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.feed }}
          fetch-depth: 0

      - name: Check the dev feed
        env:
          FEED: ${{ inputs.feed }}
        run: |
          set -euo pipefail
          printf '%s' "$FEED" | grep -Eq '^[A-Za-z0-9._-]+$'
          DEV="development-$FEED"
          git fetch -q origin "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"

          # Verify the dev feed with the pinned signer, using only dev's own files.
          mkdir -p chk
          git archive "origin/$DEV" opkg-feed | tar -x -C chk
          actual=$(sha256sum chk/opkg-feed/usign_x64 | cut -d' ' -f1)
          [ "$actual" = "$USIGN_SHA256" ] || { echo "::error::usign_x64 on $DEV does not match the pinned sha256"; exit 1; }
          chmod +x chk/opkg-feed/usign_x64
          chk/opkg-feed/usign_x64 -V -p "chk/opkg-feed/iamromulan-$FEED-repo.key" -m chk/opkg-feed/Packages
          echo "dev Packages.sig verifies" >> "$GITHUB_STEP_SUMMARY"

          n=$(git rev-list --count "origin/$FEED..origin/$DEV")
          echo "Commits on $DEV not on $FEED: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" = "0" ]; then echo "Already up to date." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "AHEAD=$n" >> "$GITHUB_ENV"
          {
            echo '```'
            git log --oneline -n 40 "origin/$FEED..origin/$DEV"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge and push
        if: inputs.confirm && env.AHEAD != '0'
        env:
          FEED: ${{ inputs.feed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -m "Merge branch '$DEV' into $FEED" "origin/$DEV" \
            || { echo "::error::merge conflict; resolve it by hand"; exit 1; }
          # The promoted feed must be exactly the signed dev feed.
          if ! git diff --quiet "origin/$DEV" HEAD -- opkg-feed; then
            echo "::error::$FEED's opkg-feed differs from $DEV after the merge; not pushing"; exit 1
          fi
          chmod +x opkg-feed/usign_x64
          opkg-feed/usign_x64 -V -p "opkg-feed/iamromulan-$FEED-repo.key" -m opkg-feed/Packages
          git push origin "HEAD:refs/heads/$FEED"
          echo "Pushed $(git rev-parse --short HEAD) to $FEED." | tee -a "$GITHUB_STEP_SUMMARY"
