# QManager (ledger B5.10): kernel-side protection for the sticky /tmp.
# With these set, root cannot open (O_CREAT) a regular file or FIFO another
# user planted in a world-writable sticky directory, which closes the
# planted-file class that safe_tmp.sh otherwise handles path by path.
# Applied at boot by /etc/init.d/sysctl; install.sh also applies it live.
fs.protected_regular=2
fs.protected_fifos=2
